services:
  senja_cms_nextjs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PORT: ${PORT:-3000}
        # Inlined at build time; sourced from .env (NEXT_PUBLIC_API_URL).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    image: senja-cms-nextjs:latest
    container_name: senja-cms-nextjs
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      CONTACT_ALLOWED_ORIGIN: ${CONTACT_ALLOWED_ORIGIN:-}
    ports:
      - "${HOST_PORT:-13052}:${PORT:-3000}"
    volumes:
      - senja_cms_data:/app/data
    networks:
      - senja_cms_network

volumes:
  senja_cms_data:
    name: senja_cms_data

networks:
  senja_cms_network:
    name: senja_cms_network
    driver: bridge
